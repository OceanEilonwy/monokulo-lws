[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"
repository = "https://github.com/OceanEilonwy/monokulo-lws"

# monero-oxide's cryptography is unusably slow unoptimised, even in tests.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
