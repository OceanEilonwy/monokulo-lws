# The monokulo-nodo packages (mk-lws) for a release tag, attached to its GitHub release and published
# in monokulo-nodo's feed. See nodo/README.md.
name: nodo

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v1.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: nodo-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  nodo:
    permissions:
      contents: write
    uses: OceanEilonwy/monokulo-nodo/.github/workflows/app-release.yml@main
    with:
      packages: mk-lws
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
