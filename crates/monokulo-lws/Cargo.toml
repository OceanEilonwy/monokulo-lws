[package]
name = "monokulo-lws"
description = "A Monero light wallet server in Rust: scans the chain for registered view keys and serves the light wallet REST API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "monokulo-lws"
path = "src/main.rs"

[dependencies]
lws-api = { path = "../lws-api" }
# The prefilter: a keyring of every account, one GPU pass a batch.
monokulo-8ar = { git = "https://github.com/OceanEilonwy/monokulo-8ar", rev = "2f8db05" }
monero-wallet = "0.2"
monero-epee = "0.2"
curve25519-dalek = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", features = ["cors", "limit", "catch-panic"] }
# The listener: hyper directly, for a header read timeout, a connection cap
# and TLS; rustls with ring, as reqwest already uses.
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1", "service"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "=0.5.3", features = ["util"] }
# Admin keys are stored as SHA3-256 hashes.
sha3 = "=0.10.9"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"
anyhow = "1"
zeroize = "1"
subtle = "2"
