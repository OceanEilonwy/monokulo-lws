[package]
name = "lws-api"
description = "Wire types of the Monero light wallet server REST API (the community spec plus monero-lws's subaddress extensions), for servers and clients alike."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
hex = "0.4"
# Secret keys are wiped when dropped and compared in constant time.
zeroize = "1"
subtle = "2"

[dev-dependencies]
serde_json = "1"
